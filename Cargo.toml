[workspace]
resolver = "2"
members = [
    "crates/rocket-sense-db",
    "crates/rocket-sense-server",
    "crates/rocket-sense-storage",
]
exclude = ["vendor/subtr-actor"]
default-members = ["crates/rocket-sense-server"]

[workspace.package]
version = "0.1.0"
authors = ["Ivan Malison <ivanmalison@gmail.com>"]
license = "MIT"
repository = "https://github.com/rlrml/rocket-sense"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
apalis = "1.0.0-rc.9"
apalis-postgres = "1.0.0-rc.8"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
boxcars = ">=0.11.1, <1.0.0"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
futures = "0.3"
hex = "0.4"
jsonwebtoken = "9"
mime = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
subtr-actor = { path = "vendor/subtr-actor" }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "net"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v5", "v7"] }
zstd = "0.13"

rocket-sense-db = { path = "crates/rocket-sense-db" }
rocket-sense-storage = { path = "crates/rocket-sense-storage" }

# --- BEGIN synced [patch.crates-io] (managed by scripts/sync-subtr-actor) ---
# Copied verbatim from vendor/subtr-actor/Cargo.toml so that subtr-actor is
# the single place that controls patched crate revisions (e.g. boxcars).
# Cargo only honors [patch] at the workspace root, hence the copy. Do not
# edit by hand; run scripts/sync-subtr-actor instead.
# A recent Rocket League update (World Cup event ball + player-name
# anonymization) added network objects that boxcars 0.11.1 cannot decode,
# which makes `must_parse_network_data()` fail on affected replays. Until the
# fix lands in an upstream boxcars release, point standalone builds at the
# patched fork. (Cargo ignores this section when subtr-actor is consumed as a
# dependency and strips it on publish, so the crates.io version range above is
# what downstream consumers still resolve.)
# See https://github.com/colonelpanic8/boxcars/tree/fix/worldcup-ball
[patch.crates-io]
boxcars = { git = "https://github.com/colonelpanic8/boxcars.git", rev = "36598aa6db6ff9248502f9f762139ed3bdd94a34" }
# --- END synced [patch.crates-io] ---
