[workspace]
resolver = "2"
members = [
    "crates/rocket-sense-db",
    "crates/rocket-sense-server",
    "crates/rocket-sense-storage",
]
default-members = ["crates/rocket-sense-server"]

[workspace.package]
version = "0.1.0"
authors = ["Ivan Malison <ivanmalison@gmail.com>"]
license = "MIT"
repository = "https://github.com/rlrml/rocket-sense"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
boxcars = ">=0.11.1, <1.0.0"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
jsonwebtoken = "9"
mime = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
subtr-actor = { git = "https://github.com/rlrml/subtr-actor", tag = "v0.8.12" }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "net"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v5", "v7"] }

rocket-sense-db = { path = "crates/rocket-sense-db" }
rocket-sense-storage = { path = "crates/rocket-sense-storage" }
