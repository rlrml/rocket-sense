name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CACHIX_CACHE_NAME: rocket-sense

jobs:
  ci:
    name: fmt + clippy + test + web
    runs-on: ubuntu-latest
    services:
      # Postgres for the DB-backed integration tests (the `#[ignore]`d tests in
      # processing_tests.rs). These run real queries against a migrated schema,
      # which is the only thing that catches sqlx decode-type vs SQL column-type
      # mismatches -- they 500 only at runtime, never at compile time.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rocket_sense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Cheap fail-fast guard: parallel PRs can each pick the same next
      # migration number, which silently breaks deploys once one is applied.
      - name: Check migration versions are unique
        run: ./scripts/check-migration-versions.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The @rlrml/* packages under web/vendor are generated from the
      # vendor/subtr-actor submodule flake (not committed), so CI needs Nix to
      # build them before npm can resolve the file: deps.
      - uses: DeterminateSystems/nix-installer-action@main

      - name: Generate vendored @rlrml packages
        run: scripts/ensure-subtr-vendor

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Check web style (Prettier + ESLint)
        working-directory: web
        run: npm run check:style

      - name: Typecheck web
        working-directory: web
        run: npm run typecheck

      # The server crate embeds web/dist via build.rs, so the web build must
      # precede any cargo build/clippy/test (mirrors the justfile dependencies).
      - name: Build web
        working-directory: web
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The `#[ignore]`d DB-backed tests: ingest a real replay, then exercise
      # every stats read path against the migrated schema so a wrong sqlx decode
      # type (e.g. i64 for an INT4 column) fails here instead of in prod. Run
      # single-threaded since both tests share the one database.
      - name: Test (DB-backed)
        env:
          RS_REPROCESS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rocket_sense_test
        run: cargo test --workspace -- --ignored --test-threads=1

  nix-image:
    name: Nix deploy image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}

      - name: Build Nix deploy image
        run: nix build --accept-flake-config .#rocket-sense-server-image --print-build-logs
