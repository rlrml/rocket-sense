<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events review</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101215;
      --panel: #171a1f;
      --panel-strong: #20242b;
      --line: #303640;
      --text: #f2f4f7;
      --muted: #a9b1bd;
      --blue: #59a7ff;
      --green: #47d18c;
      --orange: #f4a261;
      --red: #ff6b6b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: #0d0f12;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 16px 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-weight: 700;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--blue);
      font-size: 14px;
    }

    nav {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
    }

    nav a[aria-current="page"] {
      color: var(--text);
    }

    main {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .page-title {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .api-link {
      color: var(--blue);
      text-decoration: none;
      font-size: 14px;
    }

    form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 18px;
      align-items: start;
    }

    section,
    aside {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    section {
      padding: 18px;
    }

    aside {
      position: sticky;
      top: 18px;
      padding: 16px;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 16px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .mechanic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .check-tile {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-strong);
      font-size: 14px;
    }

    .check-tile input {
      width: 16px;
      height: 16px;
      accent-color: var(--green);
      flex: 0 0 auto;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 18px;
    }

    label.field {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    input,
    select {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #0f1216;
      color: var(--text);
      padding: 9px 10px;
      font: inherit;
      font-size: 14px;
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    button {
      min-height: 42px;
      border: 0;
      border-radius: 6px;
      background: var(--green);
      color: #06110b;
      font-weight: 800;
      cursor: pointer;
    }

    .secondary-link {
      display: grid;
      place-items: center;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 26px;
      padding: 0 9px;
      border: 1px solid rgba(71, 209, 140, 0.45);
      border-radius: 999px;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .side-note {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    @media (max-width: 860px) {
      .header-inner,
      .page-title,
      form {
        display: block;
      }

      nav {
        margin-top: 12px;
      }

      aside {
        position: static;
        margin-top: 18px;
      }

      .filter-grid {
        grid-template-columns: 1fr;
      }

      .api-link {
        display: inline-block;
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="/replays"><span class="brand-mark" aria-hidden="true">▰</span> rocket-sense</a>
      <nav aria-label="Primary">
        <a href="/replays">Replays</a>
        <a href="/events/review" aria-current="page">Events Review</a>
        <a href="/profile">Profile</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="page-title">
      <h1>Events review</h1>
      <a class="api-link" href="/api/v1/events?review-status=unreviewed">API queue</a>
    </div>
    <form method="get" action="/events/review/open">
      <section>

          <label class="check-tile"><input type="checkbox" name="event-type" value="boost.ledger.collected"> Boost ledger collected</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="boost.ledger.overfill"> Boost ledger overfill</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="boost.ledger.respawn"> Boost ledger respawn</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="boost.ledger.stolen"> Boost ledger stolen</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="boost.ledger.used"> Boost ledger used</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="boost.ledger.used_allocation"> Boost ledger used allocation</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="boost.pickup.both"> Boost pickup matched</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="boost.pickup.ghost"> Boost pickup ghost</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="boost.pickup.missed"> Boost pickup missed</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="boost.state"> Boost state</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="bump"> Bump</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="ceiling.shot"> Ceiling shot</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="center"> Center</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="core.assist"> Assist</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="core.death"> Death</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="core.goal"> Goal</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="core.kill"> Kill</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="core.player"> Core player</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="core.player.goal.context"> Core player goal context</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="core.save"> Save</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="core.shot"> Shot</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="dodge.reset"> Dodge reset</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="double.tap"> Double tap</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="fifty.fifty"> Fifty-fifty</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="flick"> Flick</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="flip.impulse"> Flip impulse</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="goal.context"> Goal context</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="goal_tag.aerial_goal"> Aerial goal tag</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="goal_tag.air_dribble_goal"> Air dribble goal tag</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="goal_tag.bump_goal"> Bump goal tag</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="goal_tag.counter_attack_goal"> Counter attack goal tag</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="goal_tag.double_tap_goal"> Double tap goal tag</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="goal_tag.empty_net_goal"> Empty net goal tag</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="goal_tag.flick_goal"> Flick goal tag</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="goal_tag.flip_reset_goal"> Flip reset goal tag</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="goal_tag.half_volley_goal"> Half volley goal tag</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="goal_tag.high_aerial_goal"> High aerial goal tag</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="goal_tag.long_distance_goal"> Long distance goal tag</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="goal_tag.one_timer_goal"> One timer goal tag</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="goal_tag.own_half_goal"> Own half goal tag</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="goal_tag.passing_goal"> Passing goal tag</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="half.flip"> Half flip</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="half.volley"> Half volley</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="mechanic.air_dribble"> Mechanic air dribble</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="mechanic.ball_carry"> Mechanic ball carry</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="mechanic.ceiling_shot"> Mechanic ceiling shot</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="mechanic.double_tap"> Mechanic double tap</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="mechanic.flick"> Mechanic flick</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="mechanic.flip_reset"> Mechanic flip reset</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="mechanic.half_flip"> Mechanic half flip</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="mechanic.half_volley"> Mechanic half volley</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="mechanic.musty_flick"> Mechanic musty flick</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="mechanic.one_timer"> Mechanic one timer</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="mechanic.pass"> Mechanic pass</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="mechanic.speed_flip"> Mechanic speed flip</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="mechanic.wavedash"> Mechanic wavedash</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="movement"> Movement</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="musty.flick"> Musty flick</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="one.timer"> One timer</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="pass"> Pass</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="pass.last_completed"> Last completed pass</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="positioning"> Positioning</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="possession"> Possession</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="powerslide"> Powerslide</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="pressure"> Pressure</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="rotation.depth.ahead_of_play"> Rotation depth ahead</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="rotation.depth.behind_play"> Rotation depth behind</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="rotation.depth.level_with_play"> Rotation depth level</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="rotation.depth.unknown"> Rotation depth unknown</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="rotation.first_man_stint"> Rotation first-man stint</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="rotation.player_state_span"> Rotation player state span</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="rotation.role.ambiguous"> Rotation role ambiguous</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="rotation.role.first_man"> Rotation role first man</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="rotation.role.second_man"> Rotation role second man</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="rotation.role.third_man"> Rotation role third man</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="rotation.role.unknown"> Rotation role unknown</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="rotation.team"> Rotation team</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="rush"> Rush</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="speed.flip"> Speed flip</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="territorial.pressure"> Territorial pressure</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="touch.ball.movement"> Touch ball movement</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="touch.last.touch"> Last touch</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="wall.aerial"> Wall aerial</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="wall.aerial.shot"> Wall aerial shot</label>

        </div>

        <div class="filter-grid">
          <label class="field">
            Event type
            <input name="event-type" type="text" autocomplete="off" placeholder="ball.touch or boost.pickup.both">
          </label>
          <label class="field">
            Event category
            <select name="event-category">
              <option value="" selected>All indexed events</option>
              <option value="ball">Ball</option>
              <option value="boost">Boost</option>
              <option value="bump">Bump</option>
              <option value="center">Center</option>
              <option value="core">Core</option>
              <option value="dodge">Dodge</option>
              <option value="fifty">Fifty-fifty</option>
              <option value="flip">Flip</option>
              <option value="goal">Goal</option>
              <option value="mechanic">Mechanic</option>
              <option value="goal_tag">Goal tag</option>
              <option value="half">Half volley / half flip</option>
              <option value="one">One timer</option>
              <option value="pass">Pass</option>
              <option value="positioning">Positioning</option>
              <option value="possession">Possession</option>
              <option value="powerslide">Powerslide</option>
              <option value="pressure">Pressure</option>
              <option value="rotation">Rotation</option>
              <option value="movement">Movement</option>
              <option value="rush">Rush</option>
              <option value="territorial">Territorial pressure</option>
              <option value="touch">Touch</option>
              <option value="wall">Wall aerial</option>
              <option value="whiff">Whiff</option>
            </select>
          </label>
          <label class="field">
            Review status
            <select name="review-status">
              <option value="unreviewed" selected>Unreviewed</option>
              <option value="all">All</option>
              <option value="confirmed">Confirmed</option>
              <option value="rejected">Rejected</option>
              <option value="corrected">Corrected</option>
              <option value="uncertain">Uncertain</option>
              <option value="needs_second_review">Needs second review</option>
            </select>
          </label>
          <label class="field">
            Minimum confidence
            <input name="min-confidence" type="number" min="0" max="1" step="0.01" placeholder="0.50">
          </label>
          <label class="field">
            Player ID
            <input name="player-id" type="text" autocomplete="off" placeholder="platform:platform_id">
          </label>
          <label class="field">
            Replay ID
            <input name="replay-id" type="text" autocomplete="off" placeholder="UUID">
          </label>
          <label class="field">
            Detector
            <input name="detector" type="text" autocomplete="off" placeholder="stats_timeline">
          </label>
          <label class="field">
            Count
            <input name="count" type="number" min="1" max="5000" value="1000">
          </label>
        </div>
      </section>

      <aside>
        <div class="status-chip">canonical runs only</div>
        <p class="side-note">The player opens a filtered review playlist and loads clips through the stat evaluation player.</p>
        <div class="actions">
          <button type="submit">Start review</button>
          <a class="secondary-link" href="/api/v1/events/review-playlist?review-status=unreviewed&count=100">Open manifest</a>
        </div>
      </aside>
    </form>
  </main>
  <script>
    (() => {
      const grid = document.querySelector("#event-type-grid");
      if (!grid) return;

      const selected = new Set(
        new URLSearchParams(window.location.search).getAll("event-type")
      );

      const labelFor = (eventType) => {
        const displayName = String(eventType.display_name || eventType.key || "").trim();
        const key = String(eventType.key || "").trim();
        if (!displayName || displayName === key) return key;
        return `${displayName} (${key})`;
      };

      const replaceEventTypeGrid = (eventTypes) => {
        const fragment = document.createDocumentFragment();
        for (const eventType of eventTypes) {
          if (!eventType || typeof eventType.key !== "string" || eventType.key.trim() === "") {
            continue;
          }

          const label = document.createElement("label");
          label.className = "check-tile";

          const input = document.createElement("input");
          input.type = "checkbox";
          input.name = "event-type";
          input.value = eventType.key;
          input.checked = selected.has(eventType.key);

          const text = document.createTextNode(` ${labelFor(eventType)}`);
          label.append(input, text);
          fragment.append(label);
        }

        if (fragment.childNodes.length > 0) {
          grid.replaceChildren(fragment);
        }
      };

      fetch("/api/v1/events/types", { credentials: "same-origin" })
        .then((response) => response.ok ? response.json() : null)
        .then((body) => {
          if (body && Array.isArray(body.event_types)) {
            replaceEventTypeGrid(body.event_types);
          }
        })
        .catch(() => {});
    })();
  </script>
</body>
</html>
