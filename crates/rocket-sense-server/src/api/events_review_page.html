<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events review</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101215;
      --panel: #171a1f;
      --panel-strong: #20242b;
      --line: #303640;
      --text: #f2f4f7;
      --muted: #a9b1bd;
      --blue: #59a7ff;
      --green: #47d18c;
      --orange: #f4a261;
      --red: #ff6b6b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: #0d0f12;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 16px 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-weight: 700;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--blue);
      font-size: 14px;
    }

    nav {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
    }

    nav a[aria-current="page"] {
      color: var(--text);
    }

    main {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .page-title {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .api-link {
      color: var(--blue);
      text-decoration: none;
      font-size: 14px;
    }

    form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 18px;
      align-items: start;
    }

    section,
    aside {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    section {
      padding: 18px;
    }

    aside {
      position: sticky;
      top: 18px;
      padding: 16px;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 16px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .mechanic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .check-tile {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-strong);
      font-size: 14px;
    }

    .check-tile input {
      width: 16px;
      height: 16px;
      accent-color: var(--green);
      flex: 0 0 auto;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 18px;
    }

    label.field {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    input,
    select {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #0f1216;
      color: var(--text);
      padding: 9px 10px;
      font: inherit;
      font-size: 14px;
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    button {
      min-height: 42px;
      border: 0;
      border-radius: 6px;
      background: var(--green);
      color: #06110b;
      font-weight: 800;
      cursor: pointer;
    }

    .secondary-link {
      display: grid;
      place-items: center;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 26px;
      padding: 0 9px;
      border: 1px solid rgba(71, 209, 140, 0.45);
      border-radius: 999px;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .side-note {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    @media (max-width: 860px) {
      .header-inner,
      .page-title,
      form {
        display: block;
      }

      nav {
        margin-top: 12px;
      }

      aside {
        position: static;
        margin-top: 18px;
      }

      .filter-grid {
        grid-template-columns: 1fr;
      }

      .api-link {
        display: inline-block;
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="/replays"><span class="brand-mark" aria-hidden="true">▰</span> rocket-sense</a>
      <nav aria-label="Primary">
        <a href="/replays">Replays</a>
        <a href="/events/review" aria-current="page">Events Review</a>
        <a href="/profile">Profile</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="page-title">
      <h1>Events review</h1>
      <a class="api-link" href="/api/v1/events?review-status=unreviewed">API queue</a>
    </div>
    <form method="get" action="/events/review/open" autocomplete="off">
      <section>
        <h2>Event filters</h2>
        <div id="event-type-grid" class="mechanic-grid">
          <label class="check-tile"><input type="checkbox" name="event-type" value="air_dribble"> Air dribble</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="ball_carry"> Ball carry</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="ceiling_shot"> Ceiling shot</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="double_tap"> Double tap</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="flick"> Flick</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="flip_reset"> Flip reset</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="half_flip"> Half flip</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="half_volley"> Half volley</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="musty_flick"> Musty flick</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="one_timer"> One timer</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="pass"> Pass</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="speed_flip"> Speed flip</label>
          <label class="check-tile"><input type="checkbox" name="event-type" value="wavedash"> Wavedash</label>
        </div>

        <div class="filter-grid">
          <label class="field">
            Search
            <input name="q" type="search" autocomplete="off" placeholder="filename, SHA, external ID">
          </label>
          <label class="field">
            Player name
            <input name="player-name" type="text" autocomplete="off" placeholder="Zen">
          </label>
          <label class="field">
            Primary player ID
            <input name="player-id" type="text" autocomplete="off" placeholder="platform:platform_id">
          </label>
          <label class="field">
            Review status
            <select name="review-status">
              <option value="unreviewed" selected>Unreviewed</option>
              <option value="all">All</option>
              <option value="confirmed">Confirmed</option>
              <option value="rejected">Rejected</option>
              <option value="corrected">Corrected</option>
              <option value="uncertain">Uncertain</option>
              <option value="needs_second_review">Needs second review</option>
            </select>
          </label>
          <label class="field">
            Playlist
            <select name="playlist">
              <option value="" selected>Any playlist</option>
              <option value="ranked-duels">Ranked Duels</option>
              <option value="ranked-doubles">Ranked Doubles</option>
              <option value="ranked-solo-standard">Ranked Solo Standard</option>
              <option value="ranked-standard">Ranked Standard</option>
              <option value="unranked-duels">Unranked Duels</option>
              <option value="unranked-doubles">Unranked Doubles</option>
              <option value="unranked-standard">Unranked Standard</option>
              <option value="unranked-chaos">Unranked Chaos</option>
              <option value="ranked-hoops">Ranked Hoops</option>
              <option value="ranked-rumble">Ranked Rumble</option>
              <option value="ranked-dropshot">Ranked Dropshot</option>
              <option value="ranked-snowday">Ranked SnowDay</option>
              <option value="snowday">SnowDay</option>
              <option value="rocketlabs">RocketLabs</option>
              <option value="hoops">Hoops</option>
              <option value="rumble">Rumble</option>
              <option value="tournament">Tournament</option>
              <option value="dropshot">Dropshot</option>
              <option value="dropshot-rumble">Dropshot Rumble</option>
              <option value="heatseeker">Heatseeker</option>
              <option value="private">Private</option>
              <option value="season">Season</option>
              <option value="offline">Offline</option>
              <option value="local">Local Lobby</option>
            </select>
          </label>
          <label class="field">
            Map
            <input name="map" type="text" autocomplete="off" placeholder="stadium_p">
          </label>
          <label class="field">
            Pro players
            <select name="pro">
              <option value="" selected>Any</option>
              <option value="true">Has pro player</option>
              <option value="false">No pro players</option>
            </select>
          </label>
          <label class="field">
            Minimum confidence
            <input name="min-confidence" type="number" min="0" max="1" step="0.01" placeholder="0.50">
          </label>
          <label class="field">
            Replay ID
            <input name="replay-id" type="text" autocomplete="off" placeholder="UUID">
          </label>
          <label class="field">
            Detector
            <input name="detector" type="text" autocomplete="off" placeholder="stats_timeline">
          </label>
          <label class="field">
            Uploaded after
            <input name="created-after" type="text" autocomplete="off" placeholder="2026-06-01T00:00:00Z">
          </label>
          <label class="field">
            Uploaded before
            <input name="created-before" type="text" autocomplete="off" placeholder="2026-06-05T23:59:59Z">
          </label>
          <label class="field">
            Played after
            <input name="replay-date-after" type="text" autocomplete="off" placeholder="2026-06-01T00:00:00Z">
          </label>
          <label class="field">
            Played before
            <input name="replay-date-before" type="text" autocomplete="off" placeholder="2026-06-05T23:59:59Z">
          </label>
          <label class="field">
            Event indexed after
            <input name="event-created-after" type="text" autocomplete="off" placeholder="2026-06-01T00:00:00Z">
          </label>
          <label class="field">
            Event indexed before
            <input name="event-created-before" type="text" autocomplete="off" placeholder="2026-06-05T23:59:59Z">
          </label>
          <label class="field">
            Uploader
            <input name="uploader" type="text" autocomplete="off" placeholder="user UUID">
          </label>
          <label class="field">
            Group
            <input name="group" type="text" autocomplete="off" placeholder="replay group UUID">
          </label>
          <label class="field">
            Project
            <input name="project" type="text" autocomplete="off" placeholder="project UUID">
          </label>
          <label class="field">
            Count
            <input name="count" type="number" min="1" max="5000" value="1000">
          </label>
        </div>
      </section>

      <aside>
        <div class="status-chip">canonical runs only</div>
        <p class="side-note">The player opens a filtered review playlist and loads clips through the stat evaluation player.</p>
        <div class="actions">
          <button type="submit">Start review</button>
          <a class="secondary-link" href="/api/v1/events/review-playlist?review-status=unreviewed&count=100">Open manifest</a>
        </div>
      </aside>
    </form>
  </main>
  <script>
    (() => {
      const grid = document.querySelector("#event-type-grid");
      if (!grid) return;

      const selected = new Set(
        new URLSearchParams(window.location.search).getAll("event-type")
      );

      const labelFor = (eventType) => {
        const displayName = String(eventType.display_name || eventType.key || "").trim();
        const key = String(eventType.key || "").trim();
        if (!displayName || displayName === key) return key;
        return `${displayName} (${key})`;
      };

      const resetEventTypeFilters = () => {
        document.querySelectorAll('input[name="event-type"]').forEach((input) => {
          input.checked = false;
        });
      };

      const replaceEventTypeGrid = (eventTypes) => {
        const fragment = document.createDocumentFragment();
        for (const eventType of eventTypes) {
          if (!eventType || typeof eventType.key !== "string" || eventType.key.trim() === "") {
            continue;
          }

          const label = document.createElement("label");
          label.className = "check-tile";

          const input = document.createElement("input");
          input.type = "checkbox";
          input.name = "event-type";
          input.value = eventType.key;
          input.checked = selected.has(eventType.key);

          const text = document.createTextNode(` ${labelFor(eventType)}`);
          label.append(input, text);
          fragment.append(label);
        }

        if (fragment.childNodes.length > 0) {
          grid.replaceChildren(fragment);
        }
      };

      window.addEventListener("pageshow", resetEventTypeFilters);
      fetch("/api/v1/events/types", { credentials: "same-origin" })
        .then((response) => response.ok ? response.json() : null)
        .then((body) => {
          if (body && Array.isArray(body.event_types)) {
            replaceEventTypeGrid(body.event_types);
          }
        })
        .catch(() => {});
    })();
  </script>
</body>
</html>
