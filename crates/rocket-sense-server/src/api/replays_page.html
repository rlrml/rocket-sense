<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Rocket Sense Replays</title>
  <style>
    :root {
      color-scheme: light;
      font-family: BlinkMacSystemFont, -apple-system, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #4a4a4a;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      color: #4a4a4a;
      font-size: 16px;
      line-height: 24px;
    }

    header {
      border-bottom: 1px solid #f5f5f5;
      background: #ffffff;
    }

    .header-inner, main {
      width: min(1152px, calc(100% - 32px));
      margin: 0 auto;
    }

    .header-inner {
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .nav-left, .nav-links {
      display: flex;
      align-items: stretch;
      gap: 0;
      min-height: 56px;
    }

    .brand-mark {
      width: 64px;
      display: flex;
      align-items: center;
      color: #00d1b2;
      font-size: 28px;
      line-height: 1;
    }

    .nav-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 12px;
      color: #363636;
      font-size: 16px;
      line-height: 56px;
      text-decoration: none;
      white-space: nowrap;
    }

    .nav-item.active {
      background: #f5f5f5;
    }

    .nav-caret {
      color: #485fc7;
      font-size: 14px;
    }

    main {
      padding: 20px 0 32px;
      display: grid;
      gap: 24px;
    }

    form {
      display: grid;
      gap: 14px;
      padding: 14px 0 24px;
      border-bottom: 1px solid #eeeeee;
    }

    label {
      display: grid;
      gap: 5px;
      color: #536176;
      font-size: 12px;
      font-weight: 650;
    }

    input, select, button {
      height: 36px;
      box-sizing: border-box;
      border: 1px solid #dbdbdb;
      border-radius: 4px;
      padding: 0 11px;
      font: inherit;
      background: #ffffff;
      color: #363636;
    }

    button, .button {
      display: inline-flex;
      min-height: 36px;
      align-items: center;
      justify-content: center;
      border: 1px solid #00d1b2;
      border-radius: 4px;
      padding: 0 12px;
      background: #00d1b2;
      color: #ffffff;
      text-decoration: none;
      cursor: pointer;
    }

    .secondary-button {
      border-color: #dbdbdb;
      background: #ffffff;
      color: #363636;
    }

    .counter-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
    }

    .counter {
      display: inline-flex;
      overflow: hidden;
      border-radius: 4px;
      line-height: 24px;
    }

    .counter span:first-child {
      padding: 0 9px;
      background: #f5f5f5;
    }

    .counter strong {
      padding: 0 10px;
      background: #00d1b2;
      color: #ffffff;
      font-weight: 600;
    }

    .search-grid {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) minmax(260px, 1.2fr);
      gap: 12px;
    }

    .field-help {
      color: #363636;
      font-size: 12px;
      font-weight: 400;
      line-height: 17px;
    }

    .pro-check, .filter-group label {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #363636;
      font-size: 16px;
      font-weight: 400;
      line-height: 20px;
    }

    .playlist-groups {
      display: grid;
      grid-template-columns: repeat(5, minmax(130px, 1fr));
      gap: 24px;
      padding-top: 18px;
    }

    .filter-group {
      display: grid;
      align-content: start;
      gap: 4px;
    }

    .filter-group-title {
      color: #999999;
      font-size: 16px;
      font-variant: small-caps;
      font-weight: 400;
      line-height: 20px;
    }

    .filter-group input,
    .pro-check input,
    .actions input {
      width: 13px;
      height: 13px;
      margin: 0;
      padding: 0;
      flex: 0 0 13px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 12px;
      padding-top: 4px;
    }

    .form-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 4px;
    }

    .form-action-left, .token {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .token input {
      width: min(420px, 48vw);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }

    .sortbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding-top: 0;
      border-top: 1px solid #eeeeee;
    }

    .sort-pill {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      padding: 0 16px;
      border: 1px solid #dbdbdb;
      border-radius: 4px;
      background: #ffffff;
      color: #363636;
      cursor: pointer;
    }

    .sort-pill.active {
      border-color: #00d1b2;
      color: #00b89c;
    }

    .result-count {
      margin-left: 6px;
      color: #363636;
      font-weight: 600;
    }

    .keyboard-hint {
      width: max-content;
      max-width: 100%;
      justify-self: center;
      padding: 10px;
      background: #fafafa;
      color: #363636;
      font-size: 12px;
      line-height: 18px;
    }

    .keyboard-hint code {
      color: #ff3860;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
    }

    .replay-list {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid #dbdbdb;
      background: #ffffff;
    }

    .replay-row {
      display: flex;
      min-height: 106px;
      border-left: 1px solid #dbdbdb;
      border-right: 1px solid #dbdbdb;
      border-bottom: 1px solid #dbdbdb;
      background: #ffffff;
    }

    .replay-row.selected {
      box-shadow: inset 3px 0 0 #00d1b2;
    }

    .score {
      width: 100px;
      display: flex;
      flex: 0 0 100px;
      font-weight: 700;
      text-align: center;
    }

    .score-side {
      width: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .score-side.blue {
      color: #209cee;
      background: #fafdff;
    }

    .score-side.orange {
      color: #ee6f58;
      background: #fffbfa;
    }

    .replay-main {
      min-width: 0;
      flex: 1;
      padding: 5px 10px;
    }

    .row1 {
      min-height: 32px;
      display: flex;
      align-items: flex-start;
      gap: 0;
    }

    .replay-title {
      margin: 0 10px 0 0;
      max-width: min(380px, 42vw);
      overflow: hidden;
      color: #4a4a4a;
      font-size: 16px;
      font-weight: 700;
      line-height: 32px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .replay-title a,
    .team-player a,
    .meta-line a,
    .actions a {
      color: inherit;
      text-decoration: none;
    }

    .replay-title a {
      color: #485fc7;
    }

    .replay-title a:hover,
    .team-player a:hover,
    .meta-line a:hover {
      text-decoration: underline;
    }

    .replay-meta {
      display: flex;
      min-width: 0;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      line-height: 32px;
    }

    .tag {
      display: inline-flex;
      max-width: 220px;
      align-items: center;
      overflow: hidden;
      padding: 0 9px;
      border-radius: 4px;
      background: #f5f5f5;
      color: #4a4a4a;
      font-size: 12px;
      line-height: 14px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions {
      margin-left: auto;
      display: flex;
      align-items: flex-start;
      gap: 6px;
      color: #999999;
      font-size: 15px;
      font-weight: 700;
      line-height: 32px;
      white-space: nowrap;
    }

    .actions a {
      width: 24px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .actions input {
      margin: 9px 3px 0 0;
    }

    .action-icon {
      width: 14px;
      height: 14px;
      display: inline-block;
      color: currentColor;
      vertical-align: -2px;
    }

    .meta-line {
      display: flex;
      min-height: 22px;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 2px 20px;
      overflow: visible;
      color: #666666;
      font-size: 12px;
      line-height: 18px;
      white-space: normal;
    }

    .meta-line .uploaded {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .meta-line > span {
      white-space: nowrap;
    }

    .uploader-link {
      color: #4a4a4a;
      font-weight: 700;
    }

    .uploader-avatar {
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      background: #effaf5;
      color: #363636;
      font-size: 13px;
      font-weight: 700;
      line-height: 20px;
      overflow: hidden;
    }

    .teams {
      display: flex;
      gap: 0;
      margin-top: 10px;
    }

    .team {
      min-width: 0;
      max-width: 50%;
      flex: 0 0 50%;
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      align-items: center;
      color: #666666;
      font-size: 12.8px;
      font-weight: 800;
      line-height: 24px;
    }

    .team-player {
      min-width: 0;
      max-width: 170px;
      display: inline-flex;
      align-items: center;
      overflow: hidden;
      padding: 0 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .team-player:first-child {
      padding-left: 0;
    }

    .team-player a,
    .platform {
      min-width: 0;
      display: inline-flex;
      align-items: center;
    }

    .platform-icon {
      width: 13px;
      height: 13px;
      display: inline-block;
      flex: 0 0 13px;
      margin-right: 3px;
      color: currentColor;
    }

    .team.blue .platform {
      color: #209cee;
    }

    .team.orange .platform {
      color: #ee6f58;
    }

    .empty, .error {
      padding: 24px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #ffffff;
      color: #536176;
    }

    .error {
      border-color: #f3b4ad;
      color: #b42318;
    }

    .pager {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .pager button {
      background: #ffffff;
      color: #18202f;
      border-color: #c6cfda;
      font-weight: 650;
    }

    .pager button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    @media (max-width: 860px) {
      .header-inner, main {
        width: min(100% - 20px, 1152px);
      }

      .header-inner,
      .form-actions {
        align-items: flex-start;
        flex-direction: column;
      }

      .nav-left, .nav-links {
        min-height: 0;
        flex-wrap: wrap;
      }

      .nav-item {
        line-height: 40px;
      }

      .search-grid,
      .playlist-groups,
      .detail-grid {
        grid-template-columns: 1fr 1fr;
      }

      .token, .token input {
        width: 100%;
      }

      .sortbar {
        align-items: flex-start;
        flex-wrap: wrap;
        justify-content: flex-start;
      }

      .replay-row {
        min-height: 0;
      }

      .score {
        width: 58px;
        flex-basis: 58px;
      }

      .score-side {
        width: 29px;
      }

      .row1, .meta-line, .teams {
        display: block;
      }

      .replay-title {
        max-width: 100%;
      }

      .actions {
        margin-left: 0;
      }

      .team {
        margin-top: 6px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="nav-left">
        <div class="brand-mark" aria-hidden="true">▰</div>
        <nav class="nav-links" aria-label="Primary">
          <a class="nav-item active" href="/replays">Replays</a>
          <a class="nav-item" href="/profile">▰ Replay Groups</a>
          <a class="nav-item" href="/mechanics/review">▤ Mechanics Review <span class="nav-caret">⌄</span></a>
          <a class="nav-item" href="/profile">♜ Top <span class="nav-caret">⌄</span></a>
          <a class="nav-item" href="/profile">♟ Community <span class="nav-caret">⌄</span></a>
          <a class="nav-item" href="/profile">● Patreon</a>
          <a class="nav-item" href="/profile">? Help <span class="nav-caret">⌄</span></a>
        </nav>
      </div>
      <a class="button" href="/profile">◉ Login</a>
    </div>
  </header>
  <main>
    <form id="filters">
      <div class="counter-row">
        <div class="counter"><span>total replays</span><strong id="total-counter">0</strong></div>
        <div class="counter"><span>queue size</span><strong>0</strong></div>
      </div>

      <div class="search-grid">
        <label>
          <input name="title" placeholder="Title">
          <span class="field-help">Replay title</span>
        </label>
        <div>
          <label>
            <input name="player-name" placeholder="Player">
            <span class="field-help">Player name (put between quotes for exact search, e.g. "Squishy")</span>
          </label>
          <label class="pro-check"><input type="checkbox" name="pro" value="true"> Limit to pro-players</label>
        </div>
      </div>

      <div class="playlist-groups">
        <div class="filter-group">
          <div class="filter-group-title">Ranked</div>
          <label><input type="checkbox" name="playlist" value="ranked-duels"> Ranked Duels</label>
          <label><input type="checkbox" name="playlist" value="ranked-doubles"> Ranked Doubles</label>
          <label><input type="checkbox" name="playlist" value="ranked-solo-standard"> Ranked Solo Standard</label>
          <label><input type="checkbox" name="playlist" value="ranked-standard"> Ranked Standard</label>
        </div>
        <div class="filter-group">
          <div class="filter-group-title">Unranked</div>
          <label><input type="checkbox" name="playlist" value="unranked-duels"> Unranked Duels</label>
          <label><input type="checkbox" name="playlist" value="unranked-doubles"> Unranked Doubles</label>
          <label><input type="checkbox" name="playlist" value="unranked-standard"> Unranked Standard</label>
          <label><input type="checkbox" name="playlist" value="unranked-chaos"> Unranked Chaos</label>
        </div>
        <div class="filter-group">
          <div class="filter-group-title">Extra Modes</div>
          <label><input type="checkbox" name="playlist" value="ranked-hoops"> Ranked Hoops</label>
          <label><input type="checkbox" name="playlist" value="ranked-rumble"> Ranked Rumble</label>
          <label><input type="checkbox" name="playlist" value="ranked-dropshot"> Ranked Dropshot</label>
          <label><input type="checkbox" name="playlist" value="ranked-snowday"> Ranked SnowDay</label>
        </div>
        <div class="filter-group">
          <div class="filter-group-title">Other Modes</div>
          <label><input type="checkbox" name="playlist" value="snowday"> SnowDay</label>
          <label><input type="checkbox" name="playlist" value="rocketlabs"> RocketLabs</label>
          <label><input type="checkbox" name="playlist" value="hoops"> Hoops</label>
          <label><input type="checkbox" name="playlist" value="rumble"> Rumble</label>
          <label><input type="checkbox" name="playlist" value="tournament"> Tournament</label>
          <label><input type="checkbox" name="playlist" value="dropshot"> Dropshot</label>
          <label><input type="checkbox" name="playlist" value="dropshot-rumble"> Dropshot Rumble</label>
          <label><input type="checkbox" name="playlist" value="heatseeker"> Heatseeker</label>
        </div>
        <div class="filter-group">
          <div class="filter-group-title">Misc</div>
          <label><input type="checkbox" name="playlist" value="private"> Private</label>
          <label><input type="checkbox" name="playlist" value="season"> Season</label>
          <label><input type="checkbox" name="playlist" value="offline"> Offline</label>
          <label><input type="checkbox" name="playlist" value="local"> Local Lobby</label>
        </div>
      </div>

      <div class="detail-grid">
        <label>
          Map
          <input name="map" placeholder="stadium_p">
        </label>
        <label>
          Status
          <select name="status">
            <option value="">Any</option>
            <option value="pending">Pending</option>
            <option value="parsing">Parsing</option>
            <option value="parsed">Parsed</option>
            <option value="failed">Failed</option>
          </select>
        </label>
        <label>
          Replay date
          <input name="replay-date-after" placeholder="YYYY-MM-DD">
        </label>
        <label>
          Upload date
          <input name="created-after" placeholder="YYYY-MM-DD">
        </label>
      </div>

      <div class="form-actions">
        <div class="form-action-left">
          <button type="submit">Filter</button>
          <button id="random" class="secondary-button" type="button">Random replay</button>
        </div>
        <label class="token">
          API token
          <input id="token" type="password" autocomplete="off" placeholder="Optional bearer token">
        </label>
      </div>
    </form>

    <div id="summary" class="visually-hidden">Loading replays...</div>
    <div id="content"></div>
    <div class="pager">
      <button id="previous" type="button">Previous</button>
      <button id="next" type="button">Next</button>
    </div>
  </main>

  <script>
    const form = document.querySelector("#filters");
    const content = document.querySelector("#content");
    const summary = document.querySelector("#summary");
    const tokenInput = document.querySelector("#token");
    const previousButton = document.querySelector("#previous");
    const nextButton = document.querySelector("#next");
    const randomButton = document.querySelector("#random");
    const totalCounter = document.querySelector("#total-counter");
    const pageSize = 50;
    const initialParams = new URLSearchParams(location.search);
    let offset = Number(initialParams.get("offset") || 0);
    let sortBy = normalizeSortBy(initialParams.get("sort-by"));
    let sortDir = normalizeSortDir(initialParams.get("sort-dir"));
    let nextOffset = null;
    let currentReplays = [];
    let currentTotal = 0;
    let selectedReplayIndex = 0;

    tokenInput.value = localStorage.getItem("rocket_sense_access_token") || "";
    tokenInput.addEventListener("change", () => {
      localStorage.setItem("rocket_sense_access_token", tokenInput.value.trim());
      offset = 0;
      loadReplays();
    });

    function restoreFilters() {
      const params = new URLSearchParams(location.search);
      for (const element of form.elements) {
        if (!element.name || element.type === "submit") continue;
        if (element.type === "checkbox") {
          element.checked = params.getAll(element.name).includes(element.value);
        } else {
          element.value = params.get(element.name) || "";
        }
      }
    }

    function normalizeParamValue(key, value) {
      if ((key === "created-after" || key === "replay-date-after") && /^\d{4}-\d{2}-\d{2}$/.test(value)) {
        return `${value}T00:00:00Z`;
      }
      return value;
    }

    function buildParams() {
      const params = new URLSearchParams();
      const data = new FormData(form);
      for (const [key, value] of data.entries()) {
        const text = String(value).trim();
        if (text) params.append(key, normalizeParamValue(key, text));
      }
      params.set("count", String(pageSize));
      params.set("offset", String(offset));
      params.set("sort-by", sortBy);
      params.set("sort-dir", sortDir);
      return params;
    }

    function normalizeSortBy(value) {
      return value === "upload-date" ? "upload-date" : "replay-date";
    }

    function normalizeSortDir(value) {
      return value === "asc" ? "asc" : "desc";
    }

    function sortButton(label, value) {
      const active = sortBy === value;
      const direction = sortDir === "asc" ? "⌃" : "⌄";
      return `<button class="sort-pill${active ? " active" : ""}" type="button" data-sort-by="${value}">${label}${active ? direction : ""}</button>`;
    }

    function headers() {
      const token = tokenInput.value.trim();
      return token ? { Authorization: `Bearer ${token}` } : {};
    }

    function statsUrl(replay) {
      return `/replays/${encodeURIComponent(replay.id)}/stats`;
    }

    function fileUrl(replay) {
      return `/api/v1/replays/${encodeURIComponent(replay.id)}/file`;
    }

    function playerProfileUrl(player) {
      if (!player.platform || !player.platform_player_id) return "";
      return `/players/${encodeURIComponent(player.platform)}/${encodeURIComponent(player.platform_player_id)}`;
    }

    function replayName(replay) {
      return replay.original_file_name || replay.external_replay_id || replay.id;
    }

    function uploaderName(replay) {
      const uploader = replay.uploaded_by;
      return uploader?.display_name || uploader?.primary_email || replay.uploaded_by_user_id || "";
    }

    function uploaderAvatar(replay, uploader) {
      const text = uploader || replay.uploaded_by_user_id || "?";
      return String(text).trim().charAt(0).toUpperCase() || "?";
    }

    function formatBytes(value) {
      if (!Number.isFinite(value)) return "";
      return new Intl.NumberFormat(undefined, { style: "unit", unit: "byte", notation: "compact" }).format(value);
    }

    function formatUtcDate(value) {
      if (!value) return "";
      const date = new Date(value);
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "UTC",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).formatToParts(date).reduce((memo, part) => {
        memo[part.type] = part.value;
        return memo;
      }, {});
      return `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}`;
    }

    function formatDuration(seconds) {
      if (!Number.isFinite(seconds)) return "";
      const total = Math.max(0, Math.round(seconds));
      const minutes = Math.floor(total / 60);
      const remaining = total % 60;
      return `${minutes}:${String(remaining).padStart(2, "0")}`;
    }

    function formatOvertime(seconds) {
      const duration = formatDuration(seconds);
      return duration ? `${duration} overtime` : "";
    }

    function playlistLabel(value) {
      const raw = String(value || "").trim();
      const key = raw.toLowerCase().replace(/[_-]/g, " ").replace(/\s+/g, " ");
      const aliases = {
        "1": "unranked-duels",
        "duel": "unranked-duels",
        "duels": "unranked-duels",
        "casual duel": "unranked-duels",
        "casual duels": "unranked-duels",
        "unranked duel": "unranked-duels",
        "unranked duels": "unranked-duels",
        "2": "unranked-doubles",
        "doubles": "unranked-doubles",
        "casual doubles": "unranked-doubles",
        "unranked doubles": "unranked-doubles",
        "3": "unranked-standard",
        "standard": "unranked-standard",
        "casual standard": "unranked-standard",
        "unranked standard": "unranked-standard",
        "4": "unranked-chaos",
        "chaos": "unranked-chaos",
        "casual chaos": "unranked-chaos",
        "unranked chaos": "unranked-chaos",
        "10": "ranked-duels",
        "ranked duel": "ranked-duels",
        "ranked duels": "ranked-duels",
        "11": "ranked-doubles",
        "ranked doubles": "ranked-doubles",
        "12": "ranked-solo-standard",
        "ranked solo standard": "ranked-solo-standard",
        "13": "ranked-standard",
        "ranked standard": "ranked-standard",
        "27": "ranked-hoops",
        "ranked hoops": "ranked-hoops",
        "28": "ranked-rumble",
        "ranked rumble": "ranked-rumble",
        "29": "ranked-dropshot",
        "ranked dropshot": "ranked-dropshot",
        "30": "ranked-snowday",
        "snow day": "ranked-snowday",
        "ranked snow day": "ranked-snowday"
      };
      const labels = {
        "ranked-duels": "Ranked Duels",
        "ranked-doubles": "Ranked Doubles",
        "ranked-standard": "Ranked Standard",
        "ranked-solo-standard": "Ranked Solo Standard",
        "ranked-hoops": "Ranked Hoops",
        "ranked-rumble": "Ranked Rumble",
        "ranked-dropshot": "Ranked Dropshot",
        "ranked-snowday": "Ranked SnowDay",
        "unranked-duels": "Unranked Duels",
        "unranked-doubles": "Unranked Doubles",
        "unranked-standard": "Unranked Standard",
        "unranked-chaos": "Unranked Chaos",
        "private": "Private",
        "season": "Season",
        "offline": "Offline",
        "tournament": "Tournament",
        "hoops": "Hoops",
        "rumble": "Rumble",
        "dropshot": "Dropshot",
        "snowday": "SnowDay",
        "rocketlabs": "RocketLabs",
        "dropshot-rumble": "Dropshot Rumble",
        "heatseeker": "Heatseeker"
      };
      const normalized = aliases[key] || raw;
      return labels[normalized] || raw || "";
    }

    function playerTeams(replay) {
      const players = Array.isArray(replay.players) ? replay.players : [];
      return [
        players.filter((player) => player.team === 0),
        players.filter((player) => player.team === 1)
      ];
    }

    function modeLabel(replay) {
      const [blue, orange] = playerTeams(replay);
      const size = Math.max(blue.length, orange.length);
      return size > 0 ? `${size}v${size}` : "";
    }

    function shortGuid(value) {
      if (!value) return "";
      const text = String(value);
      return text.length > 6 ? `${text.slice(0, 2)}..${text.slice(-2)}` : text;
    }

    function platformIcon(player) {
      switch ((player.platform || "").toLowerCase()) {
        case "steam":
          return `<svg class="platform-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="currentColor"/><circle cx="10.8" cy="5.2" r="2.1" fill="#fff"/><circle cx="10.8" cy="5.2" r="1.1" fill="currentColor"/><path d="M4.1 8.8l3.2 1.3a2.7 2.7 0 1 0 1-1.2L5 7.6z" fill="#fff"/><circle cx="6.2" cy="11" r="1.2" fill="currentColor"/></svg>`;
        case "epic":
          return `<svg class="platform-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12v2H9v2h3v2H9v3H7v-3H4v-2h3v-2H2z" fill="currentColor"/></svg>`;
        case "ps4":
        case "psn":
          return `<svg class="platform-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2l6.3 11H1.7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`;
        case "xbox":
          return `<svg class="platform-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 4c2.2 1 5.8 4.8 8 8M12 4c-2.2 1-5.8 4.8-8 8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>`;
        default:
          return `<svg class="platform-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12v2H9v2h3v2H9v3H7v-3H4v-2h3v-2H2z" fill="currentColor"/></svg>`;
      }
    }

    function renderTeam(players, teamClass) {
      if (players.length === 0) {
        return `<div class="team ${teamClass}"><span class="team-player soft">No players indexed</span></div>`;
      }

      return `
        <div class="team ${teamClass}">
          ${players.map((player) => {
            const name = player.name || player.platform_player_id || "Unknown";
            const href = playerProfileUrl(player);
            const label = `<span class="platform">${platformIcon(player)}</span>${escapeHtml(name)}${player.is_pro ? " ★" : ""}`;
            return `<span class="team-player" title="${escapeHtml(name)}">${href ? `<a href="${href}">${label}</a>` : label}</span>`;
          }).join("")}
        </div>
      `;
    }

    function text(value) {
      return value == null || value === "" ? "-" : String(value);
    }

    function iconDownload() {
      return `<svg class="action-icon action-download" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M7 1h2v7h3l-4 4-4-4h3zM3 13h10v2H3z"/></svg>`;
    }

    function iconGroup() {
      return `<svg class="action-icon action-group" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2 3h12L8 6zM2 7h12l-6 3zM2 11h12l-6 3z"/></svg>`;
    }

    function render(replays, total) {
      if (replays.length === 0) {
        content.innerHTML = `<div class="empty">No replays match these filters.</div>`;
        return;
      }

      const rows = replays.map((replay) => {
        const name = replayName(replay);
        const uploader = uploaderName(replay);
        const replayHref = statsUrl(replay);
        const summary = replay.summary || {};
        const scores = summary.team_scores || {};
        const blueScore = scores.blue == null ? "-" : scores.blue;
        const orangeScore = scores.orange == null ? "-" : scores.orange;
        const [bluePlayers, orangePlayers] = playerTeams(replay);
        const tags = [
          playlistLabel(replay.playlist),
          modeLabel(replay),
          summary.season,
          replay.status === "parsed" ? "" : replay.status
        ].filter(Boolean);
        const metadata = [
          replay.map_code,
          formatDuration(summary.duration_seconds),
          formatUtcDate(replay.replay_date),
          formatOvertime(summary.overtime_seconds),
          shortGuid(summary.match_guid) || formatBytes(replay.byte_size)
        ].filter(Boolean);

        return `
        <li class="replay-row" data-replay-index="${escapeHtml(currentReplays.indexOf(replay))}" tabindex="-1">
          <div class="score">
            <div class="score-side blue"><span>${escapeHtml(blueScore)}</span></div>
            <div class="score-side orange"><span>${escapeHtml(orangeScore)}</span></div>
          </div>
          <div class="replay-main">
            <div class="row1">
              <h2 class="replay-title" title="${escapeHtml(name)}">
                <a href="${replayHref}" target="_blank" rel="noopener">${escapeHtml(name)}</a>
              </h2>
              <div class="replay-meta">
                ${tags.map((tag) => `<span class="tag" title="${escapeHtml(tag)}">${escapeHtml(tag)}</span>`).join("")}
              </div>
              <div class="actions">
                <input type="checkbox" aria-label="Select replay ${escapeHtml(name)}">
                <a href="${fileUrl(replay)}" title="Download replay" aria-label="Download replay">${iconDownload()}</a>
                <a href="${statsUrl(replay)}" target="_blank" rel="noopener" title="Replay stats" aria-label="Replay stats">${iconGroup()}</a>
              </div>
            </div>
            <div class="meta-line">
              <span class="uploaded" title="${escapeHtml(uploader)}">Uploaded by <span class="uploader-avatar">${escapeHtml(uploaderAvatar(replay, uploader))}</span><a class="uploader-link" href="/profile">${escapeHtml(text(uploader))}</a> (${escapeHtml(formatUtcDate(replay.created_at))} UTC)</span>
              ${metadata.map((value) => `<span>${escapeHtml(value)}</span>`).join("")}
            </div>
            <div class="teams">
              ${renderTeam(bluePlayers, "blue")}
              ${renderTeam(orangePlayers, "orange")}
            </div>
          </div>
        </li>
      `;
      }).join("");

      content.innerHTML = `
        <div class="sortbar">
          ${sortButton("Upload Date", "upload-date")}
          ${sortButton("Replay Date", "replay-date")}
          <span class="result-count">${escapeHtml(total >= 10000 ? "10000+" : total)} result(s)</span>
        </div>
        <div class="keyboard-hint">You can use <code>j</code> and <code>k</code> to navigate between replays, and <code>enter</code> to open a replay.</div>
        <ol class="replay-list">${rows}</ol>
      `;
      updateSelectedReplay(false);
    }

    function replayRows() {
      return Array.from(content.querySelectorAll(".replay-row"));
    }

    function updateSelectedReplay(shouldScroll = true) {
      const rows = replayRows();
      selectedReplayIndex = Math.min(Math.max(selectedReplayIndex, 0), Math.max(rows.length - 1, 0));
      rows.forEach((row, index) => {
        const selected = index === selectedReplayIndex;
        row.classList.toggle("selected", selected);
        row.setAttribute("aria-current", selected ? "true" : "false");
      });
      if (shouldScroll && rows[selectedReplayIndex]) {
        rows[selectedReplayIndex].scrollIntoView({ block: "nearest" });
      }
    }

    function selectedReplay() {
      return currentReplays[selectedReplayIndex] || null;
    }

    async function openRandomReplay() {
      if (currentTotal <= 0) return;

      const params = buildParams();
      params.set("count", "1");
      params.set("offset", String(Math.floor(Math.random() * currentTotal)));

      randomButton.disabled = true;
      try {
        const response = await fetch(`/api/v1/replays?${params.toString()}`, {
          headers: headers(),
          credentials: "same-origin"
        });
        const body = await response.json();
        if (!response.ok) {
          throw new Error(body.error || "Random replay failed");
        }

        const replay = body.replays?.[0];
        if (replay) location.href = statsUrl(replay);
      } catch (error) {
        summary.textContent = error.message;
      } finally {
        randomButton.disabled = currentTotal <= 0;
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[character]));
    }

    async function loadReplays() {
      const params = buildParams();
      history.replaceState(null, "", `/replays?${params.toString()}`);
      summary.textContent = "Loading replays...";
      content.innerHTML = "";
      previousButton.disabled = offset === 0;
      nextButton.disabled = true;

      try {
        const response = await fetch(`/api/v1/replays?${params.toString()}`, {
          headers: headers(),
          credentials: "same-origin"
        });
        const body = await response.json();
        if (!response.ok) {
          throw new Error(body.error || "Replay search failed");
        }

        nextOffset = body.next_offset;
        currentReplays = body.replays || [];
        currentTotal = body.total || 0;
        selectedReplayIndex = 0;
        totalCounter.textContent = new Intl.NumberFormat(undefined).format(body.total);
        summary.textContent = `${body.total} total replays`;
        previousButton.disabled = offset === 0;
        nextButton.disabled = nextOffset == null;
        randomButton.disabled = currentTotal <= 0;
        render(currentReplays, currentTotal);
      } catch (error) {
        summary.textContent = "Replay search failed";
        currentReplays = [];
        currentTotal = 0;
        randomButton.disabled = true;
        content.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      offset = 0;
      loadReplays();
    });

    content.addEventListener("click", (event) => {
      const button = event.target.closest("[data-sort-by]");
      if (!button) return;

      const nextSortBy = normalizeSortBy(button.dataset.sortBy);
      sortDir = sortBy === nextSortBy && sortDir === "desc" ? "asc" : "desc";
      sortBy = nextSortBy;
      offset = 0;
      loadReplays();
    });

    previousButton.addEventListener("click", () => {
      offset = Math.max(0, offset - pageSize);
      loadReplays();
    });

    nextButton.addEventListener("click", () => {
      if (nextOffset != null) {
        offset = nextOffset;
        loadReplays();
      }
    });

    randomButton.addEventListener("click", openRandomReplay);

    document.addEventListener("keydown", (event) => {
      const target = event.target;
      if (target instanceof HTMLInputElement || target instanceof HTMLSelectElement || target instanceof HTMLTextAreaElement || target?.isContentEditable) {
        return;
      }

      if (event.key === "j" || event.key === "ArrowDown") {
        selectedReplayIndex += 1;
        updateSelectedReplay();
        event.preventDefault();
      } else if (event.key === "k" || event.key === "ArrowUp") {
        selectedReplayIndex -= 1;
        updateSelectedReplay();
        event.preventDefault();
      } else if (event.key === "Enter") {
        const replay = selectedReplay();
        if (replay) location.href = statsUrl(replay);
      }
    });

    restoreFilters();
    loadReplays();
  </script>
</body>
</html>
